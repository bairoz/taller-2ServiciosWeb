spring.application.name=psicometria-api
server.port=8080

# ---------------------------------------------------------------------
#  Base de datos (PostgreSQL)
#  Los valores se leen de variables de entorno o de application-local.properties
#  (ver application-local.properties.example). No subir contraseñas al repositorio.
# ---------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/psicometria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo crean los scripts de database/. Hibernate solo verifica que las
# entidades coincidan con las tablas; nunca crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
